<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zvezek</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <script>
    // Apply the remembered sidebar width and collapsed state before the page is drawn
    try {
      var w = parseInt(localStorage.getItem('sidebarWidth'), 10);
      if (w >= 200 && w <= 480) document.documentElement.style.setProperty('--sidebar-w', w + 'px');
      if (localStorage.getItem('sidebarCollapsed') === '1') document.documentElement.classList.add('sidebar-collapsed');
    } catch (err) { /* private mode: use the defaults */ }
  </script>
  <link rel="stylesheet" href="/vendor/fonts/bricolage/400.css">
  <link rel="stylesheet" href="/vendor/fonts/bricolage/600.css">
  <link rel="stylesheet" href="/vendor/fonts/bricolage/700.css">
  <link rel="stylesheet" href="/vendor/fonts/literata/400.css">
  <link rel="stylesheet" href="/vendor/fonts/literata/600.css">
  <link rel="stylesheet" href="/vendor/fonts/literata/400-italic.css">
  <link rel="stylesheet" href="/vendor/font-awesome/css/font-awesome.min.css">
  <link rel="stylesheet" href="/vendor/easymde/easymde.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside id="sidebar">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M3 26 L12 11 L17 18 L21 13 L29 26 Z"/><circle cx="24" cy="7" r="3"/></svg>
      <span>Zvezek</span>
      <button id="collapse-sidebar" title="Hide sidebar (Ctrl+L)" aria-label="Hide sidebar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M9.5 4.5v15M16 10l-2 2 2 2"/></svg>
      </button>
    </div>

    <nav class="views" aria-label="Views">
      <button data-view="notes" class="active"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h5"/></svg><span>Notes</span></button>
      <button data-view="calendar"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>Calendar</span></button>
      <button data-view="tasks"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="m8.5 12.3 2.5 2.5 4.5-5"/></svg><span>Tasks</span><span id="overdue-badge" class="badge" hidden></span></button>
    </nav>

    <input id="search" type="search" placeholder="Search notes" aria-label="Search notes" autocomplete="off">

    <div class="sidebar-head">
      <span>Your notes</span>
      <span class="head-buttons">
        <button id="new-folder" title="New folder" aria-label="New folder"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 6.5a1.5 1.5 0 0 1 1.5-1.5h4l2 2.5H19a1.5 1.5 0 0 1 1.5 1.5v9A1.5 1.5 0 0 1 19 19.5H5A1.5 1.5 0 0 1 3.5 18z"/><path d="M12 11v5M9.5 13.5h5"/></svg></button>
        <button id="new-note" title="New note" aria-label="New note">+</button>
      </span>
    </div>
    <div id="note-list"></div>

    <div id="select-bar" hidden>
      <span id="select-count"></span>
      <button id="select-move" class="quiet">Move to folder</button>
      <button id="select-hide" class="quiet">Hide</button>
      <button id="select-delete" class="quiet danger">Delete</button>
      <button id="select-clear" class="quiet">Clear</button>
    </div>
    <button id="open-settings" class="sidebar-link">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
      <span>Settings</span>
    </button>
  </aside>

  <!-- Drag this edge to resize the sidebar; arrow keys work too -->
  <div id="sidebar-resizer" role="separator" aria-orientation="vertical" aria-label="Resize sidebar"
       aria-valuemin="200" aria-valuemax="480" tabindex="0" title="Drag to resize, double-click to reset"></div>

  <!-- Shown instead of the sidebar when it is hidden -->
  <nav id="mini-nav" aria-label="Views">
    <button id="expand-sidebar" title="Show sidebar (Ctrl+L)" aria-label="Show sidebar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M9.5 4.5v15M14 10l2 2-2 2"/></svg>
    </button>
    <button data-view="notes" class="active" title="Notes" aria-label="Notes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h5"/></svg></button>
    <button data-view="calendar" title="Calendar" aria-label="Calendar"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></button>
    <button data-view="tasks" title="Tasks" aria-label="Tasks"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="m8.5 12.3 2.5 2.5 4.5-5"/></svg></button>
  </nav>

  <main>
    <button id="menu-toggle" aria-label="Show notes list"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>

    <!-- Notes view -->
    <section id="view-notes" class="view active">
      <div id="tabs" role="tablist" aria-label="Open notes" hidden></div>
      <header class="view-head">
        <input id="note-title" aria-label="Note name" spellcheck="false">
        <span id="save-state"></span>
        <button id="full-view" class="quiet" title="Full view (Alt+Shift+F)">Full view</button>
        <button id="delete-note" class="quiet">Delete</button>
      </header>
      <div id="draft-bar" hidden>
        <span id="draft-text"></span>
        <button id="draft-restore" class="primary">Restore</button>
        <button id="draft-discard" class="quiet">Discard</button>
      </div>
      <div class="editor-wrap">
        <textarea id="editor"></textarea>
      </div>
      <!-- Other files (images, pdf, text ...) open here, in a tab -->
      <div id="file-viewer" hidden>
        <header>
          <strong id="file-name"></strong>
          <span id="file-info"></span>
          <a id="file-download" class="quiet-link" download>Download</a>
        </header>
        <div id="file-body"></div>
      </div>
      <div id="empty-notes" class="empty" hidden>
        <svg viewBox="0 0 64 40" aria-hidden="true"><path d="M2 38 20 10l10 15 8-10 24 23Z"/><circle cx="50" cy="8" r="4"/></svg>
        <h2>Nothing open</h2>
        <p>Pick a note from the list, or start a fresh one.</p>
        <button class="primary" id="empty-new">New note</button>
      </div>
    </section>

    <!-- Calendar view -->
    <section id="view-calendar" class="view">
      <header class="view-head">
        <h1>Calendar</h1>
        <button class="primary" data-add>Add to Inbox</button>
      </header>
      <div id="cat-filter" aria-label="Show categories" hidden></div>
      <div id="calendar"></div>
    </section>

    <!-- Tasks view -->
    <section id="view-tasks" class="view">
      <header class="view-head">
        <h1>Tasks</h1>
        <div class="seg" id="task-group-switch" role="group" aria-label="Group tasks">
          <button data-group="date">By date</button>
          <button data-group="category">By category</button>
        </div>
        <button class="primary" data-add>Add to Inbox</button>
      </header>
      <div id="task-groups"></div>
    </section>
  </main>

  <div id="scrim"></div>

  <nav id="tabbar" aria-label="Views">
    <button data-view="notes" class="active"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h5"/></svg><span>Notes</span></button>
    <button data-view="calendar"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>Calendar</span></button>
    <button data-view="tasks"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="m8.5 12.3 2.5 2.5 4.5-5"/></svg><span>Tasks</span></button>
  </nav>

  <!-- Move selected notes -->
  <dialog id="move-dialog">
    <form id="move-form" method="dialog">
      <h2 id="move-title">Move notes</h2>
      <label>Folder
        <select id="move-folder" name="folder"></select>
      </label>
      <label id="move-new-wrap" hidden>New folder name
        <input id="move-new" name="newFolder" autocomplete="off" placeholder="School/2026">
      </label>
      <div class="actions">
        <button type="button" class="quiet" id="move-cancel">Cancel</button>
        <button type="submit" class="primary">Move</button>
      </div>
    </form>
  </dialog>

  <!-- Quick add dialog -->
  <dialog id="add-dialog">
    <form id="add-form" method="dialog">
      <h2>Add to Inbox</h2>
      <label>What
        <input name="text" required autocomplete="off" placeholder="Hand in Docker naloga">
      </label>
      <div class="type-switch">
        <label><input type="radio" name="type" value="task" checked> Task</label>
        <label><input type="radio" name="type" value="event"> Event</label>
      </div>
      <div class="row">
        <label>Date <input type="date" name="date"></label>
        <label>Time <input type="time" name="time"></label>
      </div>
      <label class="repeat-field">Repeat
        <select name="repeat">
          <option value="none">Does not repeat</option>
          <option value="daily">Every day</option>
          <option value="weekdays">Every weekday</option>
          <option value="weekly">Every week</option>
          <option value="monthly">Every month</option>
          <option value="yearly">Every year</option>
        </select>
      </label>
      <div class="row ends-row" hidden>
        <label>Ends
          <select name="ends">
            <option value="never">Never</option>
            <option value="date">On date</option>
            <option value="count">After N times</option>
          </select>
        </label>
        <label class="ends-date" hidden>Last date <input type="date" name="until"></label>
        <label class="ends-count" hidden>Times <input type="number" name="count" min="1" max="999" value="10"></label>
      </div>
      <label class="repeat-field">Category
        <select name="category"></select>
      </label>
      <div class="actions">
        <label class="check more"><input type="checkbox" name="more"><span>Create more</span></label>
        <button type="button" class="quiet" id="add-cancel">Cancel</button>
        <button type="submit" class="primary">Add</button>
      </div>
    </form>
  </dialog>

  <!-- Settings (saved on the server, so they are the same on every device) -->
  <dialog id="settings-dialog">
    <form id="settings-form" method="dialog">
      <h2>Settings</h2>
      <label class="check">
        <input type="checkbox" name="showInbox">
        <span>Show Inbox in sidebar</span>
      </label>
      <p class="hint" id="inbox-hint"></p>
      <label class="check">
        <input type="checkbox" name="livePreview">
        <span>Live preview (hide **, #, &gt; ... away from the cursor)</span>
      </label>
      <label class="check">
        <input type="checkbox" name="wideEditor">
        <span>Wide editor (use the full width, not a reading column)</span>
      </label>
      <label class="check">
        <input type="checkbox" name="showHidden">
        <span>Show hidden notes in the sidebar</span>
      </label>
      <div id="hidden-list" class="hidden-list"></div>
      <label class="number-row">
        <span>Biggest file shown in a tab (MB)</span>
        <input type="number" name="maxFileMB" min="1" max="1000" step="1">
      </label>
      <h3>Keyboard shortcuts</h3>
      <dl class="shortcut-list" id="shortcut-list"></dl>
      <h3>Categories</h3>
      <p class="hint flush">Write <code>#name</code> on a task or event line. Pick a colour for each name.</p>
      <div id="category-list"></div>
      <button type="button" class="quiet" id="category-add">Add category</button>
      <div class="actions">
        <button type="submit" class="primary">Done</button>
      </div>
    </form>
  </dialog>

  <!-- Edit one task or event from the calendar or the Tasks view -->
  <div id="item-popover" class="popover" role="dialog" aria-label="Edit" hidden>
    <form id="popover-form" autocomplete="off">
      <label>Title <input name="title" required></label>
      <div class="row">
        <label>Date <input type="date" name="date"></label>
        <label>Time <input type="time" name="time"></label>
      </div>
      <div class="row">
        <label>Category <select name="category"></select></label>
        <label>Repeat <select name="repeat"></select></label>
      </div>
      <div class="row ends-row" hidden>
        <label>Ends
          <select name="ends">
            <option value="never">Never</option>
            <option value="date">On date</option>
            <option value="count">After N times</option>
          </select>
        </label>
        <label class="ends-date" hidden>Last date <input type="date" name="until"></label>
        <label class="ends-count" hidden>Times <input type="number" name="count" min="1" max="999" value="10"></label>
      </div>
      <label class="check" id="popover-done"><input type="checkbox" name="done"><span>Done</span></label>
      <div class="actions">
        <button type="button" class="quiet danger" id="popover-delete">Delete</button>
        <button type="button" class="quiet" id="popover-open">Open note</button>
        <button type="submit" class="primary">Save</button>
      </div>
    </form>
  </div>

  <!-- Right-click menu of the sidebar (notes, files and folders) -->
  <div id="context-menu" role="menu" hidden></div>

  <div id="toast" role="status"></div>

  <script src="/vendor/easymde/easymde.min.js"></script>
  <script src="/vendor/fullcalendar/index.global.min.js"></script>
  <script src="lists.js"></script>
  <script src="dates.js"></script>
  <script src="app.js"></script>
</body>
</html>
